name: Zotero Word native snapshot patch compatibility

on:
  push:
    branches: [feature/upstream-word-placeholder-conversion]
    paths:
      - 'upstream-prep/patches/zotero-word-for-windows-integration/**'
      - '.github/workflows/zotero-word-snapshot-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-to-official-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AutoCite preparation branch
        uses: actions/checkout@v4
      - name: Clone official Zotero Word for Windows source
        run: git clone --depth 1 https://github.com/zotero/zotero-word-for-windows-integration.git original
      - name: Confirm patch applies cleanly
        working-directory: original
        run: |
          git apply --check --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0001-main-story-readonly-snapshot.patch"
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0001-main-story-readonly-snapshot.patch"
          git apply --check --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0002-main-story-field-ranges.patch"
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0002-main-story-field-ranges.patch"
          git apply --check --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0003-fix-com-story-ranges-wrapper.patch"
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0003-fix-com-story-ranges-wrapper.patch"
          git apply --check --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0004-fix-arm64-release-output-paths.patch"
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0004-fix-arm64-release-output-paths.patch"
          git apply --check --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0005-verified-main-story-field-free-segment.patch"
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/upstream-prep/patches/zotero-word-for-windows-integration/0005-verified-main-story-field-free-segment.patch"
          git diff --check
      - name: Confirm new native interfaces and ARM64 output configuration
        working-directory: original
        run: |
          grep -q 'statusCode __stdcall getMainStorySnapshot' build/zoteroWinWordIntegration/document.cpp
          grep -q 'getMainStorySnapshot(' build/zoteroWinWordIntegration/zoteroWinWordIntegration.h
          grep -q 'getMainStorySnapshot: lib.declare' components/zoteroWinWordIntegration.mjs
          grep -q 'getMainStorySnapshot: function' components/zoteroWinWordIntegration.mjs
          grep -q 'statusCode __stdcall getMainStoryFieldRanges' build/zoteroWinWordIntegration/document.cpp
          grep -q 'getMainStoryFieldRanges(' build/zoteroWinWordIntegration/zoteroWinWordIntegration.h
          grep -q 'getMainStoryFieldRanges: lib.declare' components/zoteroWinWordIntegration.mjs
          grep -q 'getMainStoryFieldRanges: function' components/zoteroWinWordIntegration.mjs
          grep -q 'CStoryRanges stories = doc->comDoc.get_StoryRanges();' build/zoteroWinWordIntegration/document.cpp
          grep -Fq '<OutDir Condition="' build/zoteroWinWordIntegration/zoteroWinWordIntegration.vcxproj
          grep -Fq '$(SolutionDir)$(Platform)\$(Configuration)\</OutDir>' build/zoteroWinWordIntegration/zoteroWinWordIntegration.vcxproj
          grep -q 'statusCode __stdcall getVerifiedMainStorySegment' build/zoteroWinWordIntegration/document.cpp
          grep -q 'getVerifiedMainStorySegment(' build/zoteroWinWordIntegration/zoteroWinWordIntegration.h
          grep -q 'getVerifiedMainStorySegment: lib.declare' components/zoteroWinWordIntegration.mjs
          grep -q 'getVerifiedMainStorySegment: function' components/zoteroWinWordIntegration.mjs

# This workflow checks patch application, not C++ compilation or Word COM behavior.
# Compiling the full Word integration requires the official Visual Studio/MS Office environment.
